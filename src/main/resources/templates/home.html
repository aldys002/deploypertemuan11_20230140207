<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Home</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Mengubah warna background utama menjadi abu-abu super ringan yang lebih bersih */
            background-color: #f8f9fa;
        }
        .dashboard-card {
            border: none;
            /* Mengubah kelengkungan sudut card menjadi lebih modern */
            border-radius: 16px;
            /* Mengubah bayangan card menjadi lebih halus dan menyebar */
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            /* Mengubah warna latar avatar dari biru solid menjadi gradasi ungu-pink yang estetik */
            background: linear-gradient(135deg, #6f42c1 0%, #d63384 100%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 20px;
            /* Menambahkan efek bayangan lembut di bawah lingkaran avatar */
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.2);
        }
        /* Mengubah warna teks username highlight */
        .username-text {
            color: #6f42c1 !important;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- Mengubah warna navbar dari hitam (bg-dark) menjadi putih bersih dengan border bawah tipis -->
<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 border-bottom">
    <div class="container">
        <!-- Mengubah warna teks brand menjadi ungu dark -->
        <a class="navbar-brand font-weight-bold text-dark" href="#" style="font-weight: 700;">Sistem Informasi</a>
        <div class="ms-auto">
            <!-- Mengubah tombol logout dari outline putih menjadi outline merah (danger) agar lebih kontras -->
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm px-3 rounded-pill">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card dashboard-card p-4">
                <div class="card-body text-center">
                    <div class="d-flex justify-content-center">
                        <div class="profile-avatar" th:text="${#strings.substring(profile.nama,0,1).toUpperCase()}">U</div>
                    </div>
                    <h3 class="card-title mb-1" th:text="${profile.nama}">Nama Lengkap</h3>
                    <p class="text-muted mb-4">@<span th:text="${user.username}" class="username-text">username</span></p>

                    <hr>

                    <div class="text-start mt-4">
                        <div class="mb-3">
                            <label class="text-muted d-block small text-uppercase fw-bold">Username Akun</label>
                            <span class="fs-5 text-dark" th:text="${user.username}">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted d-block small text-uppercase fw-bold">Nama Lengkap</label>
                            <span class="fs-5 text-dark" th:text="${profile.nama}">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted d-block small text-uppercase fw-bold">Alamat Tinggal</label>
                            <span class="fs-5 text-dark" th:text="${profile.alamat}">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
