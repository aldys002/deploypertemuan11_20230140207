<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Mengubah background utama menjadi abu-abu super ringan agar serasi */
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            border: none;
            /* Mengubah kelengkungan sudut card menjadi 16px agar serasi dengan login & dashboard */
            border-radius: 16px;
            /* Mengubah bayangan card menjadi lebih halus dan menyebar */
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 450px;
        }
        /* Mengubah warna tombol utama menjadi gradasi ungu-pink sesuai tema baru */
        .btn-custom {
            background: linear-gradient(135deg, #6f42c1 0%, #d63384 100%);
            border: none;
            color: white;
            transition: opacity 0.2s ease;
        }
        .btn-custom:hover, .btn-custom:focus {
            opacity: 0.9;
            color: white;
        }
        /* Mengubah warna link 'Login di sini' menjadi warna ungu */
        .link-custom {
            color: #6f42c1;
        }
        .link-custom:hover {
            color: #d63384;
        }
        /* Menghaluskan tampilan border input & textarea saat diklik */
        .form-control:focus {
            border-color: #6f42c1;
            box-shadow: 0 0 0 0.25rem rgba(111, 66, 193, 0.15);
        }
    </style>
</head>
<body>

<div class="card register-card p-4">
    <div class="card-body">
        <h3 class="text-center fw-bold text-dark mb-2">Daftar Akun</h3>
        <p class="text-center text-muted small mb-4">Lengkapi data di bawah untuk membuat akun baru</p>

        <form th:action="@{/register}" th:object="${request}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label small fw-bold">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Username" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label small fw-bold">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Password" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="nama" class="form-label small fw-bold">Nama Lengkap</label>
                <input type="text" id="nama" th:field="*{nama}" class="form-control" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="mb-4">
                <label for="alamat" class="form-label small fw-bold">Alamat</label>
                <textarea id="alamat" th:field="*{alamat}" class="form-control" rows="3" placeholder="Masukkan alamat lengkap" required></textarea>
            </div>

            <!-- Mengganti class btn-success menjadi btn-custom untuk menerapkan warna baru -->
            <button type="submit" class="btn btn-custom w-100 py-2 fw-bold">Daftar Akun</button>
        </form>

        <div class="text-center mt-4">
            <!-- Mengganti class text-decoration-none menjadi link-custom -->
            <p class="text-muted small mb-0">Sudah punya akun? <a th:href="@{/login}" class="link-custom text-decoration-none fw-bold">Login di sini</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
